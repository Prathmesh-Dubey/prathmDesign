name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is served from https://<user>.github.io/<repo>/, so the app needs that base path.
      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no SPA fallback: serve the app for unknown paths (e.g. a refreshed /cards).
      - name: SPA fallback
        run: |
          cp dist/design-ideas/browser/index.html dist/design-ideas/browser/404.html
          touch dist/design-ideas/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/design-ideas/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
